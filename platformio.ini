; CYD Badge - firmware de cracha para ESP32-2432S028 (Cheap Yellow Display)
; Compile:  pio run -e cyd          (versao com 1 USB, ILI9341)
;           pio run -e cyd2usb      (versao com 2 USB, ST7789)
; Binario para o Launcher: .pio/build/<env>/firmware.bin

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv
lib_deps =
    https://github.com/lovyan03/LovyanGFX.git#1.2.7
    https://github.com/bblanchon/ArduinoJson.git#v7.4.2
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wno-cpp

[env:cyd]
build_flags =
    ${env.build_flags}
    -DCYD_PANEL_ILI9341

[env:cyd2usb]
build_flags =
    ${env.build_flags}
    -DCYD_PANEL_ST7789
